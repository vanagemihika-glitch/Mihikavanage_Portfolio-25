<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural for a Restaurant | Mihika Vanage</title>
    <link rel="icon" type="image/x-icon" href="favicon mv.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
      body {
        background-color: #050505;
        color: #ffffff;
        font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      .nav-blur {
        background: rgba(5, 5, 5, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .nav-blur a {
        color: #9ca3af !important;
      }
      .nav-blur a:hover {
        color: #ffffff !important;
      }

      .project-image {
        width: 100%;
        border-radius: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body class="antialiased selection:bg-purple-500 selection:text-white">
    <nav class="fixed top-0 left-0 w-full z-[9999] nav-blur">
      <div
        class="container mx-auto px-6 py-5 flex justify-between items-center"
      >
        <a
          href="../index.html"
          class="text-sm font-medium text-gray-400 hover:text-white transition"
          >Back to Portfolio</a
        >
        <div class="hidden md:flex gap-10 text-sm font-medium text-gray-400">
          <a href="../index.html#work" class="hover:text-white transition"
            >Work</a
          >
          <a href="about.html" class="hover:text-white transition">About</a>
          <a href="../index.html#contact" class="hover:text-white transition"
            >Contact</a
          >
        </div>
      </div>
    </nav>

    <section class="pt-32 pb-20 bg-black">
      <div class="container mx-auto px-6">
        <div class="max-w-4xl mx-auto">
          <div class="mb-8">
            <span
              class="text-s font-bold uppercase text-gray-500 tracking-widest"
              >Mural Design</span
            >
          </div>

          <h1
            class="text-3xl md:text-4xl font-bold mb-6 text-gradient"
            style="
              background: linear-gradient(90deg, #e8bcf7 0%, #ffffff 100%);
              -webkit-background-clip: text;
              background-clip: text;
              -webkit-text-fill-color: transparent;
            "
          >
            Mural for a Restaurant
          </h1>

          <p class="text-l md:text-xl text-gray-300 mb-12 leading-relaxed">
            A large-scale mural illustration project for a Japanese-themed
            restaurant featuring Koi fish, blending traditional Japanese art
            with modern aesthetics.
          </p>

          <div class="space-y-8">
            <img
              src="muraldesign_.jpg"
              alt="Mural Design"
              class="project-image"
            />
          </div>
        </div>
      </div>
    </section>

    <footer class="py-8 bg-black text-center border-t border-white/5">
      <div class="container mx-auto px-4">
        <a
          href="../index.html#work"
          class="text-gray-400 hover:text-white transition"
        >
          ^Back to Portfolio</a
        >
      </div>
    </footer>
  </body>
</html>
